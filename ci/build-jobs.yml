parameters:
  - name: mode
    type: string
    values:
      - pr
      - snapshot
  - name: publishing_enabled
    type: boolean
    default: false

# TODO: use the new platform names (linux-x86_64, linux-aarch64, macos-x86_64) and build macos-aarch64 in snapshot mode too, once release-trigger passes the new names.
jobs:
- job: linux
  displayName: 'Linux'
  timeoutInMinutes: 240
  ${{ if eq(parameters.mode, 'snapshot') }}:
    dependsOn: check_for_release
    condition: and(succeeded(),
                   eq(dependencies.check_for_release.outputs['out.is_release'], 'true'))
    variables:
      release_tag: $[ dependencies.check_for_release.outputs['out.release_tag'] ]
      release_sha: $[ dependencies.check_for_release.outputs['out.release_sha'] ]
      trigger_sha: $[ dependencies.check_for_release.outputs['out.trigger_sha'] ]
  strategy:
    matrix:
      x86_64:
        assignment: default
        ${{ if eq(parameters.mode, 'pr') }}:
          release_name: linux-x86_64
        ${{ if eq(parameters.mode, 'snapshot') }}:
          release_name: linux-intel
        arch_suffix: '_x86_64'
      aarch64:
        assignment: arm
        ${{ if eq(parameters.mode, 'pr') }}:
          release_name: linux-aarch64
        ${{ if eq(parameters.mode, 'snapshot') }}:
          release_name: linux-arm
        arch_suffix: '_aarch64'
  pool:
    name: 'ubuntu_20_04'
    demands: assignment -equals $(assignment)
  steps:
    - checkout: self
      clean: true
    - ${{ if eq(parameters.mode, 'snapshot') }}:
      - bash: |
          set -euo pipefail
          git checkout $(release_sha)
        displayName: 'Checkout Release Commit'
    - template: bazelisk-unix.yml
    - bash: |
        set -euo pipefail
        ci/clean-bazel-build-folder.sh
        printf '%s\n' \
          'startup --output_user_root=../../daml_build/user_root' \
          'build --disk_cache=' \
          'common --repository_cache=../../daml_build/repository_cache' \
          > sdk/.bazelrc.local
      displayName: 'Local Bazel build folder'
    - bash: |
        set -uo pipefail
        cache_flags="--remote_cache=https://bazel-cache.da-ext.net/202610"
        key=""
        if [ -n "${GCRED:-}" ]; then
          key="${AGENT_TEMPDIRECTORY:-/tmp}/gcred-${BUILD_BUILDID}.json"
          rm -f "$key"
          umask 077
          set -C
          if printf '%s' "$GCRED" > "$key"; then
            cache_flags="$cache_flags --google_credentials=$key"
            echo "credentials present; uploads enabled"
          else
            echo "could not stage credentials; falling back to read-only"
            key=""
            cache_flags="$cache_flags --remote_upload_local_results=false"
          fi
          set +C
        else
          cache_flags="$cache_flags --remote_upload_local_results=false"
          echo "no credentials; remote cache is read-only for this job"
        fi
        echo "##vso[task.setvariable variable=gcred_key]$key"
        echo "##vso[task.setvariable variable=cache_flags]$cache_flags"
      displayName: 'Configure remote cache'
      env:
        GCRED: $(GOOGLE_APPLICATION_CREDENTIALS_CONTENT)
    - ${{ if eq(parameters.mode, 'pr') }}:
      - bash: |
          set -euo pipefail
          cd sdk
          bazelisk test //bazel/checks --test_output=errors $(bazel_flags) $(build_cpu_flags) $(cache_flags)
        displayName: 'Pre-commit checks'
        continueOnError: true
      - bash: |
          set -euo pipefail
          cd sdk
          bazelisk build //... $(bazel_flags) $(build_cpu_flags) $(cache_flags)
        displayName: 'Build'
      - bash: |
          set -euo pipefail
          cd sdk
          bazelisk test //... $(bazel_flags) $(cache_flags)
        displayName: 'Test'
      - bash: |
          set -euo pipefail
          sdk/compatibility/test.sh $(bazel_flags) $(cache_flags)
        displayName: 'Compatibility'
        condition: and(succeeded(), eq(variables['release_name'], 'linux-x86_64'))
    - bash: |
        set -euo pipefail
        dir="$(Build.StagingDirectory)/release"
        archive="$(Build.StagingDirectory)/$(release_name)-release.tar"
        cd sdk
        bazelisk build //release:release $(bazel_flags) $(build_cpu_flags) $(cache_flags)
        ./bazel-bin/release/release --release-dir "$(Build.StagingDirectory)/maven"
        ci/build-release.sh "" "$(arch_suffix)"
        mkdir -p "$dir"
        ../ci/copy-unix-release-artifacts.sh $(release_tag) $(release_name) "$dir"
        tar -cf "$archive" -C "$dir" .
        echo "Release archive: $archive"
        tar -tvf "$archive"
        count=$(find "$dir" -type f | wc -l)
        size=$(du -h "$archive" | cut -f1)
        echo "  total: $count files, $size"
      env:
        DAML_SDK_RELEASE_VERSION: $(release_tag)
      displayName: 'Release - Create Artifacts'
    - ${{ if and(eq(parameters.mode, 'snapshot'), parameters.publishing_enabled) }}:
      - bash: |
          set -euo pipefail
          cd sdk
          bazelisk build //release:release $(bazel_flags) $(build_cpu_flags) $(cache_flags)
          ./bazel-bin/release/release --release-dir "$(mktemp -d)" --upload
        env:
          DAML_SDK_RELEASE_VERSION: $(release_tag)
          GPG_KEY: $(gpg-code-signing)
          MAVEN_USERNAME: $(MAVEN_USERNAME)
          MAVEN_PASSWORD: $(MAVEN_PASSWORD)
          MAVEN_URL: "https://central.sonatype.com"
          NPM_TOKEN: $(NPM_TOKEN)
        displayName: 'Release - Maven Central and npm'
        condition: and(succeeded(), eq(variables['release_name'], 'linux-intel'))
    - ${{ if not(and(eq(parameters.mode, 'snapshot'), parameters.publishing_enabled)) }}:
      - bash: |
          set -euo pipefail
          cd "$(Build.StagingDirectory)/maven"
          echo "Would upload to Maven Central:"
          find . -type f | sort | sed 's|^\./|  |'
          echo "  total: $(find . -type f | wc -l) files, $(du -sh . | cut -f1)"
          cd "$(Build.SourcesDirectory)/sdk"
          target=//language-support/js/daml-types:npm_package.publish
          npm_args="--access public"
          case "$(release_tag)" in
            *-*) npm_args="$npm_args --tag next" ;;
          esac
          if bazelisk query "$target"; then
            echo "Would publish to npm: bazel run $target -- $npm_args"
          else
            echo "##vso[task.logissue type=warning]$target does not exist, so release --upload would fail at the npm step"
          fi
        displayName: 'Release - Maven Central and npm (print only)'
        ${{ if eq(parameters.mode, 'pr') }}:
          condition: and(succeeded(), eq(variables['release_name'], 'linux-x86_64'))
        ${{ if eq(parameters.mode, 'snapshot') }}:
          condition: and(succeeded(), eq(variables['release_name'], 'linux-intel'))
    - publish: $(Build.StagingDirectory)/$(release_name)-release.tar
      artifact: $(release_name)-release
      displayName: 'Release - Publish Artifacts'
    - ${{ if and(eq(parameters.mode, 'snapshot'), parameters.publishing_enabled) }}:
      - template: tell-slack-failed.yml
        parameters:
          trigger_sha: '$(trigger_sha)'
    - bash: |
        if [ -n "${KEY:-}" ]; then rm -f "$KEY"; fi
        (cd sdk && bazelisk shutdown) || true
      displayName: 'Remove credentials'
      condition: always()
      env:
        KEY: $(gcred_key)
    - bash: ci/clean-bazel-build-folder.sh
      displayName: 'Clean local Bazel build folder'
      condition: always()

