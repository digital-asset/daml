- job: windows
  displayName: 'Windows'
  timeoutInMinutes: 240
  strategy:
    matrix:
      x86_64:
        assignment: default
        release_name: windows-x86_64
  pool:
    name: 'windows-pool'
    demands: assignment -equals $(assignment)
  steps:
    - checkout: self
      clean: true
    - template: bazelisk-windows.yml
    - powershell: |
        $ErrorActionPreference = 'Stop'
        .\ci\clean-bazel-build-folder.ps1
        Set-Content -Path sdk\.bazelrc.local -Value @(
          'startup --output_user_root=../../daml_build/user_root'
          'startup --output_base=C:/b'
          'build --disk_cache='
          'common --repository_cache=../../daml_build/repository_cache'
        )
      displayName: 'Short output base and local Bazel build folder'
    - powershell: |
        $ErrorActionPreference = 'Stop'
        Set-Location sdk
        .\setup-windows.ps1
        Write-Host "##vso[task.setvariable variable=BAZEL_SH]$env:BAZEL_SH"

        $bashDir = Split-Path -Parent ($env:BAZEL_SH -replace '/', '\')
        if (-not (Test-Path (Join-Path $bashDir 'tar.exe'))) { throw "tar.exe not found in $bashDir" }
        $shellRoot = Split-Path -Parent (Split-Path -Parent $bashDir)
        $gitDir = @('cmd', 'mingw64\bin') |
          ForEach-Object { Join-Path $shellRoot $_ } |
          Where-Object { Test-Path (Join-Path $_ 'git.exe') } |
          Select-Object -First 1
        if (-not $gitDir) { throw "git.exe not found under $shellRoot (looked in cmd, mingw64\bin)" }
        Write-Host "appending to PATH: $bashDir;$gitDir"
        $env:PATH = "$env:PATH;$bashDir;$gitDir"
        Write-Host "##vso[task.setvariable variable=PATH]$env:PATH"

        Write-Host "shutting down the Bazel server so it re-reads PATH"
        & bazelisk.exe shutdown 2>&1 | Out-Null
      displayName: 'Provision build shell'
    - powershell: |
        $cacheFlags = '--remote_cache=https://bazel-cache.da-ext.net/202610'
        $key = ''
        if ($env:GCRED) {
          $tempDir = if ($env:AGENT_TEMPDIRECTORY) { $env:AGENT_TEMPDIRECTORY } else { [System.IO.Path]::GetTempPath() }
          $key = Join-Path $tempDir "gcred-$($env:BUILD_BUILDID).json"
          try {
            Remove-Item -Force -ErrorAction SilentlyContinue $key
            [System.IO.File]::WriteAllText($key, $env:GCRED)
            $cacheFlags = "$cacheFlags --google_credentials=$($key -replace '\\', '/')"
            Write-Host 'credentials present; uploads enabled'
          } catch {
            Write-Host 'could not stage credentials; falling back to read-only'
            $key = ''
            $cacheFlags = "$cacheFlags --remote_upload_local_results=false"
          }
        } else {
          $cacheFlags = "$cacheFlags --remote_upload_local_results=false"
          Write-Host 'no credentials; remote cache is read-only for this job'
        }
        Write-Host "##vso[task.setvariable variable=gcred_key]$key"
        Write-Host "##vso[task.setvariable variable=cache_flags]$cacheFlags"
      displayName: 'Configure remote cache'
      env:
        GCRED: $(GOOGLE_APPLICATION_CREDENTIALS_CONTENT)
    - powershell: |
        $ErrorActionPreference = 'Stop'
        Set-Location sdk
        bazelisk build //... $(bazel_flags) $(build_cpu_flags) $(cache_flags)
      displayName: 'Build'
    - powershell: |
        $ErrorActionPreference = 'Stop'
        Set-Location sdk
        bazelisk test //... $(bazel_flags) $(cache_flags)
      displayName: 'Test'
    - powershell: |
        $ErrorActionPreference = 'Stop'
        Set-Location sdk
        .\ci\build-release.ps1
        $dir = '$(Build.StagingDirectory)\release' -replace '\\', '/'
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        & $env:BAZEL_SH ../ci/copy-windows-release-artifacts.sh 0.0.0 $dir
        if ($LASTEXITCODE -ne 0) { throw "copy-windows-release-artifacts.sh failed (exit code $LASTEXITCODE)" }
        Set-Location '$(Build.StagingDirectory)'
        $archive = '$(release_name)-release.tar'
        tar.exe -cf $archive -C release .
        if ($LASTEXITCODE -ne 0) { throw "tar could not create $archive (exit code $LASTEXITCODE)" }
        Write-Host "Release archive: $PWD\$archive"
        tar.exe -tvf $archive
        if ($LASTEXITCODE -ne 0) { throw "tar could not list $archive (exit code $LASTEXITCODE)" }
        $count = @(Get-ChildItem -Path release -Recurse -File).Count
        Write-Host ('  total: {0} files, {1:N1}M' -f $count, ((Get-Item $archive).Length / 1MB))
      env:
        DAML_SDK_RELEASE_VERSION: '0.0.0'
      displayName: 'Release - Create Artifacts'
    - powershell: |
        if ($env:KEY) { Remove-Item -Force -ErrorAction SilentlyContinue $env:KEY }
        Set-Location sdk
        try { & bazelisk.exe shutdown 2>&1 | Out-Null } catch { }
      displayName: 'Remove credentials'
      condition: always()
      env:
        KEY: $(gcred_key)
    - powershell: .\ci\clean-bazel-build-folder.ps1
      displayName: 'Clean local Bazel build folder'
      condition: always()
