trigger: none

pr:
  autoCancel: true # cancel previous builds on push
  branches:
    include:
      - main
      - main-2.x
      - release/*

jobs:
- job: test_flake_issue_token
  displayName: 'Test GH_DAML_READWRITE on a dummy flaky test issue'
  pool:
    name: 'ubuntu_20_04'
    demands: assignment -equals default
  steps:
    - checkout: self
      clean: true
    - bash: |
        set -euo pipefail
        eval "$(cd sdk; dev-env/bin/dade-assist)"

        gh api -i user | grep -i '^x-oauth-scopes' || echo "No X-OAuth-Scopes header (not a classic token)"

        cleanup() {
          set +e
          url=$(sed -n 's/^Created issue //p' out.txt)
          [ -n "$url" ] || return
          number=${url##*/}
          id=$(gh api repos/digital-asset/daml/issues/$number --jq .id)
          gh api --method DELETE repos/digital-asset/daml/issues/23477/sub_issue -F sub_issue_id=$id --jq '"Removed from #\(.number)"'
          item=$(gh api graphql -F n=$number \
            -f query='query($n:Int!){repository(owner:"digital-asset",name:"daml"){issue(number:$n){projectItems(first:10){nodes{id project{number}}}}}}' \
            --jq '.data.repository.issue.projectItems.nodes[] | select(.project.number==5) | .id')
          [ -z "$item" ] || gh project item-delete 5 --owner digital-asset --id "$item"
          gh issue close "$number" --repo digital-asset/daml --reason "not planned" --comment "Token test done for #23478."
        }
        trap cleanup EXIT

        (cd ci && python -u -c "import report_flakes as r; r.gh_create_issue('[test] Dummy flaky test issue for #23478, please ignore', '(token test)')") | tee out.txt

        number=$(sed -n 's|^Created issue .*/||p' out.txt)
        gh api repos/digital-asset/daml/issues/$number/parent --jq '"Parent: #\(.number)"'
        gh api graphql -F n=$number \
          -f query='query($n:Int!){repository(owner:"digital-asset",name:"daml"){issue(number:$n){projectItems(first:10){nodes{project{number title}}}}}}' \
          --jq '.data.repository.issue.projectItems.nodes[].project | "Project: \(.number) \(.title)"'
      displayName: 'Create, check and close a dummy flaky test issue'
      env:
        GH_TOKEN: $(GH_DAML_READWRITE)

