trigger: none

pr:
  autoCancel: true
  branches:
    include:
      - main
      - main-2.x
      - release/*

variables:
  bazel_flags: >-
    --remote_upload_local_results=true
  build_cpu_flags: --local_resources=cpu=HOST_CPUS
  release_tag: '0.0.0'

jobs:
- template: build-jobs.yml
  parameters:
    mode: pr
- template: split-release-job.yml
  parameters:
    mode: pr
