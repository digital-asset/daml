trigger: none

pr:
  autoCancel: true
  branches:
    include:
      - main
      - main-2.x
      - release/*

variables:
  bazel_flags: >-
    --remote_upload_local_results=true
  build_cpu_flags: --local_resources=cpu=HOST_CPUS

jobs:
- job: linux
  displayName: 'Linux'
  timeoutInMinutes: 240
  strategy:
    matrix:
      x86_64:
        assignment: default
        release_name: linux-x86_64
        arch_suffix: '_x86_64'
      aarch64:
        assignment: arm
        release_name: linux-aarch64
        arch_suffix: '_aarch64'
  pool:
    name: 'ubuntu_20_04'
    demands: assignment -equals $(assignment)
  steps:
    - checkout: self
      clean: true
    - template: bazelisk-unix.yml
    - bash: |
        set -euo pipefail
        ci/clean-bazel-build-folder.sh
        printf '%s\n' \
          'startup --output_user_root=../../daml_build/user_root' \
          'build --disk_cache=' \
          'common --repository_cache=../../daml_build/repository_cache' \
          > sdk/.bazelrc.local
      displayName: 'Local Bazel build folder'
    - bash: |
        set -uo pipefail
        cache_flags="--remote_cache=https://bazel-cache.da-ext.net/202610"
        key=""
        if [ -n "${GCRED:-}" ]; then
          key="${AGENT_TEMPDIRECTORY:-/tmp}/gcred-${BUILD_BUILDID}.json"
          rm -f "$key"
          umask 077
          set -C
          if printf '%s' "$GCRED" > "$key"; then
            cache_flags="$cache_flags --google_credentials=$key"
            echo "credentials present; uploads enabled"
          else
            echo "could not stage credentials; falling back to read-only"
            key=""
            cache_flags="$cache_flags --remote_upload_local_results=false"
          fi
          set +C
        else
          cache_flags="$cache_flags --remote_upload_local_results=false"
          echo "no credentials; remote cache is read-only for this job"
        fi
        echo "##vso[task.setvariable variable=gcred_key]$key"
        echo "##vso[task.setvariable variable=cache_flags]$cache_flags"
      displayName: 'Configure remote cache'
      env:
        GCRED: $(GOOGLE_APPLICATION_CREDENTIALS_CONTENT)
    - bash: |
        set -euo pipefail
        cd sdk
        bazelisk build //... $(bazel_flags) $(build_cpu_flags) $(cache_flags)
      displayName: 'Build'
    - bash: |
        set -euo pipefail
        cd sdk
        bazelisk test //... $(bazel_flags) $(cache_flags)
      displayName: 'Test'
    - bash: |
        set -euo pipefail
        dir="$(Build.StagingDirectory)/release"
        archive="$(Build.StagingDirectory)/$(release_name)-release.tar"
        cd sdk
        bazelisk build //release:release $(bazel_flags) $(build_cpu_flags) $(cache_flags)
        ./bazel-bin/release/release --release-dir "$(mktemp -d)"
        ci/build-release.sh "" "$(arch_suffix)"
        mkdir -p "$dir"
        ../ci/copy-unix-release-artifacts.sh 0.0.0 $(release_name) "$dir"
        tar -cf "$archive" -C "$dir" .
        echo "Release archive: $archive"
        tar -tvf "$archive"
        count=$(find "$dir" -type f | wc -l)
        size=$(du -h "$archive" | cut -f1)
        echo "  total: $count files, $size"
      env:
        DAML_SDK_RELEASE_VERSION: '0.0.0'
      displayName: 'Release - Create Artifacts'
    - bash: |
        if [ -n "${KEY:-}" ]; then rm -f "$KEY"; fi
        (cd sdk && bazelisk shutdown) || true
      displayName: 'Remove credentials'
      condition: always()
      env:
        KEY: $(gcred_key)
    - bash: ci/clean-bazel-build-folder.sh
      displayName: 'Clean local Bazel build folder'
      condition: always()

