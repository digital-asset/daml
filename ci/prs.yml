  displayName: 'macOS'
  timeoutInMinutes: 240
  strategy:
    matrix:
      x86_64:
        assignment: default
        release_name: macos-x86_64
        arch_suffix: '_x86_64'
      aarch64:
        assignment: m1-builds
        release_name: macos-aarch64
        arch_suffix: '_aarch64'
  pool:
    name: 'macOS-pool'
    demands: assignment -equals $(assignment)
  steps:
    - checkout: self
      clean: true
    - template: bazelisk-unix.yml
    - bash: |
        set -euo pipefail
        ci/clean-bazel-build-folder.sh
        printf '%s\n' \
