trigger: none

pr:
  autoCancel: true
  branches:
    include:
      - main
      - main-2.x
      - release/*

variables:
  bazel_flags: '--noremote_accept_cached --local_resources=cpu=HOST_CPUS'

jobs:
# TODO: temporarily reduced to linux x86_64 only; re-enable linux aarch64, macOS and Windows below.
- job: linux
  displayName: 'Linux'
  timeoutInMinutes: 240
  strategy:
    matrix:
      x86_64:
        assignment: default
#       aarch64:
#         assignment: arm
  pool:
    name: 'ubuntu_20_04'
    demands: assignment -equals $(assignment)
  steps:
    - checkout: self
      clean: true
    - template: bazelisk-unix.yml
    - bash: |
        set -euo pipefail
        cd sdk
        bazelisk build //... $(bazel_flags)
      displayName: 'Build'
    - bash: |
        set -euo pipefail
        cd sdk
        bazelisk test //... $(bazel_flags)
      displayName: 'Test'

