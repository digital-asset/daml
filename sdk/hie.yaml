cradle:
  multi:
    - path: "."
      config: { cradle: { bios: { shell: "bazel/ide/hls/cradle //compiler/damlc:damlc@ghci@bios" } } }
    - path: "./sdk-integration-tests"
      config: { cradle: { bios: { shell: "bazel/ide/hls/cradle //sdk-integration-tests:sdk-integration-tests@ghci@bios" } } }
    - path: "./compiler/damlc/daml-package-config/test"
      config: { cradle: { bios: { shell: "bazel/ide/hls/cradle //compiler/damlc/daml-package-config:tests@ghci@bios" } } }
    - path: "./compiler/damlc/tests"
      config: { cradle: { bios: { shell: "bazel/ide/hls/cradle //compiler/damlc/tests:tests@ghci@bios" } } }
    - path: "./release/src"
      config: { cradle: { bios: { shell: "bazel/ide/hls/cradle //release:release@ghci@bios" } } }
